</head>

<body>

                Reset View
            </button>

            <!-- Divider -->
            <div class="w-px h-5 bg-slate-300/70 mx-0.5 hidden sm:block"></div>

            <!-- Minimal Alpine Jacket Colorways -->
            <div class="flex items-center gap-2 px-1" title="Jacket Colorway">
                <button data-palette="coral" class="swatch-btn active w-4 h-4 rounded-full bg-[#e4522e] cursor-pointer"
                    aria-label="Reference Orange"></button>
                <button data-palette="ochre" class="swatch-btn w-4 h-4 rounded-full bg-[#e6a938] cursor-pointer"
                    aria-label="Summit Ochre"></button>
                <button data-palette="glacier" class="swatch-btn w-4 h-4 rounded-full bg-[#3b8ea5] cursor-pointer"

    <!-- Hint Toast -->
    <div id="toast"
        class="fixed bottom-20 left-1/2 -translate-x-1/2 z-10 glass-panel rounded-xl px-3.5 py-2 text-[11px] font-medium text-slate-600 opacity-0 pointer-events-none transition-opacity duration-300">
        Drag to orbit • Scroll to zoom • Use Speed slider for slow-mo carving inspection
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        /**
         * ============================================================================
         * COLOR PALETTES
         * ============================================================================
         */
        const PALETTES = {
            coral: {
                jacket: 0xe65632,
                jacketInner: 0xc44120,
                beanie: 0x8d959e,
                beanieCuff: 0x767f89,
                pomPom: 0x878f98,
                goggleLens: 0x1c3e66,
                pants: 0x526477,
                skiAccent: 0xe65632
            },
            ochre: {
                jacket: 0xe6a938,
                jacketInner: 0xc48a20,
                beanie: 0x67717d,
                beanieCuff: 0x545d68,
                pomPom: 0x626b76,
                goggleLens: 0x1e3a5f,
                pants: 0x455464,
                skiAccent: 0xe6a938
            },
            glacier: {
                jacket: 0x3b8ea5,
                jacketInner: 0x2a6d80,
                beanie: 0xd95d39,
                beanieCuff: 0xbf4d2c,
                pomPom: 0xcf5634,
                goggleLens: 0x182e4a,
                pants: 0x465566,
                skiAccent: 0x3b8ea5
            },
            pine: {
                jacket: 0x3f7d58,
                jacketInner: 0x2d5e41,
                beanie: 0x8d959e,
                beanieCuff: 0x767f89,
                pomPom: 0x848c96,
                goggleLens: 0x1c3e66,
                pants: 0x495867,
                skiAccent: 0x3f7d58
            }
        };

        /**
         * ============================================================================
         * PROCEDURAL LOW-POLY GEOMETRY & MATERIAL HELPERS
         * ============================================================================
         */
        function createMatteMaterial(color, roughness = 0.88, metalness = 0.02) {
            return new THREE.MeshStandardMaterial({
                color,
                roughness,
                metalness,
                flatShading: true
            });
        }

        function createLoftedGeometry(rings, radialSegments = 8, axis = 'y', capStart = true, capEnd = true) {
            const positions = [];
            const indices = [];
            const ringCount = rings.length;

            for (let i = 0; i < ringCount; i++) {
                const { pos, r1, r2, offsetA = 0, offsetB = 0, twist = 0 } = rings[i];
                for (let j = 0; j < radialSegments; j++) {
                    const theta = (j / radialSegments) * Math.PI * 2 + twist;
                    if (axis === 'y') {
                        const x = offsetA + Math.cos(theta) * r1;
                        const z = offsetB + Math.sin(theta) * r2;
                        positions.push(x, pos, z);
                    } else {
                        const y = offsetA + Math.sin(theta) * r1;
                        const z = offsetB + Math.cos(theta) * r2;
                        positions.push(pos, y, z);
                    }
                }
            }

            for (let i = 0; i < ringCount - 1; i++) {
                const rowA = i * radialSegments;
                const rowB = (i + 1) * radialSegments;
                for (let j = 0; j < radialSegments; j++) {
                    const nextJ = (j + 1) % radialSegments;
                    const a = rowA + j;
                    const b = rowB + j;
                    const c = rowB + nextJ;
                    const d = rowA + nextJ;
                    indices.push(a, b, c);
                    indices.push(a, c, d);
                }
            }

            if (capStart) {
                const r0 = rings[0];
                const centerIdx = positions.length / 3;
                if (axis === 'y') {
                    positions.push(r0.offsetA || 0, r0.pos, r0.offsetB || 0);
                } else {
                    positions.push(r0.pos, r0.offsetA || 0, r0.offsetB || 0);
                }
                for (let j = 0; j < radialSegments; j++) {
                    const nextJ = (j + 1) % radialSegments;
                    indices.push(centerIdx, j, nextJ);
                }
            }

            if (capEnd) {
                const rLast = rings[ringCount - 1];
                const lastRow = (ringCount - 1) * radialSegments;
                const centerIdx = positions.length / 3;
                if (axis === 'y') {
                    positions.push(rLast.offsetA || 0, rLast.pos, rLast.offsetB || 0);
                } else {
                    positions.push(rLast.pos, rLast.offsetA || 0, rLast.offsetB || 0);
                }
                for (let j = 0; j < radialSegments; j++) {
                    const nextJ = (j + 1) % radialSegments;
                    indices.push(centerIdx, lastRow + nextJ, lastRow + j);
                }
            }

            let geo = new THREE.BufferGeometry();
            geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
            geo.setIndex(indices);
            geo = geo.toNonIndexed();
            geo.computeVertexNormals();
            return geo;
        }

        function createFlaredCollarGeometry() {
            const segs = 12;
            const startBot = -Math.PI * 0.485;
            const endBot = Math.PI * 1.485;
            const startTop = -Math.PI * 0.35;
            const endTop = Math.PI * 1.35;

            const rBottomIn = 0.088;
            const rBottomOut = 0.126;
            const rTopIn = 0.126;
            const rTopOut = 0.162;

            const positions = [];
            const indices = [];

            const rings = [];
            for (let i = 0; i <= segs; i++) {
                const t = i / segs;
                const aBot = startBot + t * (endBot - startBot);
                const aTop = startTop + t * (endTop - startTop);

                const xb = Math.cos(aBot);
                const zb = -Math.sin(aBot);
                const xt = Math.cos(aTop);
                const zt = -Math.sin(aTop);

                const distFromFront = Math.sin(t * Math.PI);
                const hTop = 0.042 + 0.076 * Math.pow(distFromFront, 0.55);
                const hBot = -0.012 + 0.014 * distFromFront;

                rings.push({
                    bo: [xb * rBottomOut, hBot, zb * rBottomOut * 0.94],
                    to: [xt * rTopOut, hTop, zt * rTopOut * 0.95],
                    ti: [xt * rTopIn, hTop - 0.005, zt * rTopIn * 0.95],
                    bi: [xb * rBottomIn, hBot, zb * rBottomIn * 0.94]
                });
            }

            for (let i = 0; i <= segs; i++) {
                positions.push(...rings[i].bo, ...rings[i].to, ...rings[i].ti, ...rings[i].bi);
            }

            const addQuad = (a, b, c, d) => {
                indices.push(a, b, c, a, c, d);
            };

            for (let i = 0; i < segs; i++) {
                const b0 = i * 4;
                const b1 = (i + 1) * 4;
                addQuad(b0 + 0, b1 + 0, b1 + 1, b0 + 1);
                addQuad(b0 + 1, b1 + 1, b1 + 2, b0 + 2);
                addQuad(b0 + 2, b1 + 2, b1 + 3, b0 + 3);
                addQuad(b0 + 3, b1 + 3, b1 + 0, b0 + 0);
            }

            addQuad(0, 1, 2, 3);
            const last = segs * 4;
            addQuad(last + 3, last + 2, last + 1, last + 0);

            let geo = new THREE.BufferGeometry();
            geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
            geo.setIndex(indices);
            geo = geo.toNonIndexed();
            geo.computeVertexNormals();
            return geo;
        }

        /**
         * Builds a sleek low-poly alpine carving ski with upturned tip and binding plate
         */
        function createAlpineSki(skiBaseMat, skiAccentMat, bindingMat, enableShadows) {
            const skiGroup = new THREE.Group();

            // Main ski plank (length ~1.48m, centered slightly forward of ankle)
            const mainGeo = new THREE.BoxGeometry(0.112, 0.016, 1.32);
            const mainMesh = enableShadows(new THREE.Mesh(mainGeo, skiBaseMat));
            mainMesh.position.set(0, -0.138, 0.08);
            skiGroup.add(mainMesh);

            // Subtle top accent racing stripe
            const stripeGeo = new THREE.BoxGeometry(0.068, 0.005, 1.18);
            const stripeMesh = enableShadows(new THREE.Mesh(stripeGeo, skiAccentMat));
            stripeMesh.position.set(0, -0.128, 0.08);
            skiGroup.add(stripeMesh);

            // Upturned front shovel tip
            const tipGeo = new THREE.BoxGeometry(0.106, 0.014, 0.22);
            const tipMesh = enableShadows(new THREE.Mesh(tipGeo, skiAccentMat));
            tipMesh.position.set(0, -0.106, 0.82);
            tipMesh.rotation.x = -0.34;
            skiGroup.add(tipMesh);

            // Slight upturned twin-tip tail
            const tailGeo = new THREE.BoxGeometry(0.104, 0.014, 0.14);
            const tailMesh = enableShadows(new THREE.Mesh(tailGeo, skiBaseMat));
            tailMesh.position.set(0, -0.128, -0.63);
            tailMesh.rotation.x = 0.18;
            skiGroup.add(tailMesh);

            // Toe & heel binding blocks
            const bindGeo = new THREE.BoxGeometry(0.088, 0.024, 0.075);
            const toeBind = enableShadows(new THREE.Mesh(bindGeo, bindingMat));
            toeBind.position.set(0, -0.122, 0.21);
            const heelBind = enableShadows(new THREE.Mesh(bindGeo, bindingMat));
            heelBind.position.set(0, -0.122, -0.12);
            skiGroup.add(toeBind, heelBind);

            return skiGroup;
        }

        /**
         * ============================================================================
         * BUILD HIERARCHICAL LOW-POLY SKIER CHARACTER (ANIMATION-READY RIG)
         * ============================================================================
         */
        function buildSkierCharacter(initialPalette = PALETTES.coral) {
            const root = new THREE.Group();
            root.name = 'skierRoot';

            const materials = {
                jacket: createMatteMaterial(initialPalette.jacket, 0.86, 0.01),
                jacketInner: createMatteMaterial(initialPalette.jacketInner, 0.90, 0.01),
                pants: createMatteMaterial(initialPalette.pants, 0.88, 0.01),
                beanie: createMatteMaterial(initialPalette.beanie, 0.94, 0.0),
                beanieCuff: createMatteMaterial(initialPalette.beanieCuff, 0.94, 0.0),
                pomPom: createMatteMaterial(initialPalette.pomPom, 0.96, 0.0),
                skin: createMatteMaterial(0xdcc3ae, 0.88, 0.0),
                innerShirt: createMatteMaterial(0x353b44, 0.92, 0.0),
                goggleFrame: createMatteMaterial(0x1f242c, 0.65, 0.05),
                goggleStrap: createMatteMaterial(0x222730, 0.88, 0.0),
                goggleLens: new THREE.MeshStandardMaterial({
                    color: initialPalette.goggleLens,
                    roughness: 0.42,
                    metalness: 0.16,
                    flatShading: true
                }),
                glove: createMatteMaterial(0x23272e, 0.85, 0.03),
                boot: createMatteMaterial(0x2b3038, 0.78, 0.04),
                bootSole: createMatteMaterial(0x4c5460, 0.84, 0.03),
                bootAccent: createMatteMaterial(0x8c95a3, 0.80, 0.03),
                skiBase: createMatteMaterial(0x262c36, 0.62, 0.12),
                skiAccent: createMatteMaterial(initialPalette.skiAccent, 0.55, 0.08),
                poleShaft: new THREE.MeshStandardMaterial({
                    color: 0x69727e,
                    roughness: 0.52,
                    metalness: 0.32,
                    flatShading: true
                }),
                poleGrip: createMatteMaterial(0x2d333c, 0.86, 0.04),
                poleBasket: createMatteMaterial(0x4a525e, 0.80, 0.04)
            };

            const collarMat = materials.jacket.clone();
            collarMat.side = THREE.DoubleSide;

            const enableShadows = (mesh) => {
                mesh.castShadow = true;
                mesh.receiveShadow = true;
                return mesh;
            };

            const joints = {};
            const skis = [];
            const footContacts = []; // Reference points at bottom of soles/skis for grounding

            // ------------------------------------------------------------------------
            // 1. HIPS (Pelvis pivot at y = 0.82)
            // ------------------------------------------------------------------------
            const hips = new THREE.Group();
            hips.name = 'hips';
            hips.rotation.order = 'YXZ'; // Vertical spin (Y) outermost so pitch/roll stay local to skier
            hips.position.set(0, 0.82, 0);
            root.add(hips);
            joints.hips = hips;

            const pelvisGeo = createLoftedGeometry([
                { pos: -0.055, r1: 0.168, r2: 0.118 },
                { pos: 0.005, r1: 0.178, r2: 0.125 },
                { pos: 0.055, r1: 0.172, r2: 0.120 }
            ], 8, 'y', true, true);
            hips.add(enableShadows(new THREE.Mesh(pelvisGeo, materials.pants)));

            // ------------------------------------------------------------------------
            // 2. SPINE & SCULPTED FACETED PUFFER JACKET TORSO
            // ------------------------------------------------------------------------
            const spine = new THREE.Group();
            spine.name = 'spine';
            spine.position.set(0, 0.02, 0);
            hips.add(spine);
            joints.spine = spine;

            const torsoGeo = createLoftedGeometry([
                { pos: -0.095, r1: 0.236, r2: 0.162, twist: 0.0 },
                { pos: -0.045, r1: 0.268, r2: 0.184, twist: 0.0 },
                { pos: 0.065, r1: 0.258, r2: 0.178, twist: 0.08 },
                { pos: 0.185, r1: 0.248, r2: 0.174, twist: 0.0 },
                { pos: 0.310, r1: 0.272, r2: 0.186, twist: 0.08 },
                { pos: 0.435, r1: 0.282, r2: 0.184, twist: 0.0 },
                { pos: 0.515, r1: 0.232, r2: 0.158, twist: 0.08 },
                { pos: 0.555, r1: 0.140, r2: 0.124, twist: 0.0 }
            ], 10, 'y', true, true);
            spine.add(enableShadows(new THREE.Mesh(torsoGeo, materials.jacket)));

            const collarGeo = createFlaredCollarGeometry();
            const collarMesh = enableShadows(new THREE.Mesh(collarGeo, collarMat));
            collarMesh.position.set(0, 0.538, 0.004);
            spine.add(collarMesh);

            const innerNeckGeo = new THREE.CylinderGeometry(0.076, 0.088, 0.040, 8);
            const innerNeckMesh = enableShadows(new THREE.Mesh(innerNeckGeo, materials.innerShirt));
            innerNeckMesh.position.set(0, 0.548, 0.006);
            spine.add(innerNeckMesh);

            // ------------------------------------------------------------------------
            // 3. NECK & HEAD
            // ------------------------------------------------------------------------
            const neck = new THREE.Group();
            neck.name = 'neck';
            neck.position.set(0, 0.535, 0);
            spine.add(neck);
            joints.neck = neck;

            const neckSkinGeo = new THREE.CylinderGeometry(0.062, 0.072, 0.048, 8);
            const neckSkinMesh = enableShadows(new THREE.Mesh(neckSkinGeo, materials.skin));
            neckSkinMesh.position.set(0, 0.022, 0);
            neck.add(neckSkinMesh);

            function createGoggleShape(w, hTop, hBot, notchW, notchH) {

                s.quadraticCurveTo(notchW * 0.55, -hBot + notchH * 0.25, 0, -hBot + notchH);

                s.quadraticCurveTo(-w * 0.88, -hBot, -w * 0.94, -hBot * 0.45);
                s.lineTo(-w, hTop * 0.35);
                s.quadraticCurveTo(-w, hTop, -w * 0.72, hTop);
                return s;

            const bendGeometry = (geo, radius = 0.24) => {

            return { root, joints, materials, footContacts, setPalette, setSkisVisible, resetPose };

        /**
         * ============================================================================
         * PROCEDURAL ANIMATION ENGINE (CARVING, IDLE, JUMP, 360° SPIN + BLENDING)
         * ============================================================================
         */
        function createSkierAnimator(skier) {
            const { root, joints, footContacts } = skier;

            let mode = 'carving'; // 'carving' | 'idle' | 'jump' | 'spin360' | 'tpose'
            let isPlaying = true;
            let speed = 1.0;
            let animTime = 0;

            // Target pose structure for smooth exponential damping
            const jointNames = [
                'hips', 'spine', 'neck', 'head',
                'leftShoulder', 'leftElbow', 'leftWrist',
                'rightShoulder', 'rightElbow', 'rightWrist',
                'leftHip', 'leftKnee', 'leftAnkle',
                'rightHip', 'rightKnee', 'rightAnkle'
            ];

            const targets = {};
            jointNames.forEach((name) => {
                targets[name] = { rx: 0, ry: 0, rz: 0 };
            });
            const hipPosTarget = { x: 0, z: 0 };

            // Airborne height & grounding blend state (0 = grounded, 1 = full mid-air COM arc)
            let airOffsetTarget = 0;      // Upright jump height added above grounded ski contact
            let airOffsetCurrent = 0;
            let freeAirBlendTarget = 0;   // 1 during inverted flips so inverted skis don't push rig underground
            let freeAirBlendCurrent = 0;
            let freeAirHipYTarget = 0.82; // Target pelvis height during inverted airtime
            let freeAirHipYCurrent = 0.82;

            function clearTargets() {
                jointNames.forEach((name) => {
                    targets[name].rx = 0;
                    targets[name].ry = 0;
                    targets[name].rz = 0;
                });
                hipPosTarget.x = 0;
                hipPosTarget.z = 0;
                airOffsetTarget = 0;
                freeAirBlendTarget = 0;
                freeAirHipYTarget = 0.82;
            }

            // Utility math helpers for smooth animation curves & 360° wrapping
            function clamp01(v) {
                return Math.max(0, Math.min(1, v));
            }

            function smoothstep(edge0, edge1, x) {
                const t = clamp01((x - edge0) / (edge1 - edge0));
                return t * t * (3 - 2 * t);
            }

            function bell(u, start, peak, end) {
                if (u <= start || u >= end) return 0;
                return u < peak
                    ? smoothstep(start, peak, u)
                    : 1 - smoothstep(peak, end, u);
            }

            function shortestAngleDelta(target, current) {
                let d = (target - current) % (Math.PI * 2);
                if (d > Math.PI) d -= Math.PI * 2;
                if (d < -Math.PI) d += Math.PI * 2;
                return d;
            }

            // Smooth periodic Gaussian pulse over [0, 2π] for pole plant & push-back phases
            function phasePulse(angle, center, width) {
                const d = Math.atan2(Math.sin(angle - center), Math.cos(angle - center));
                const x = d / width;
                return Math.exp(-x * x);
            }

            /**
             * ANIMATION 1: ALPINE CARVING
             * Continuous S-turn cycle with edge angulation, upper/lower body separation,
             * inside/outside leg flexion asymmetry, and synchronized reach-forward -> push-back pole action.
             */
            function evaluateCarving(t) {
                // 2.6-second full left-to-right S-turn cycle
                const omega = (Math.PI * 2) / 2.6;
                const phi = t * omega;

                const s = Math.sin(phi);               // Primary turn signal: +1 Left carve, -1 Right carve
                const p = s * s;                       // Double-frequency G-force compression (0 at edge change, 1 at apex)
                const leftTurn = Math.max(0, s);
                const rightTurn = Math.max(0, -s);

                // Two-stage carving pole action on the carving-side hand:
                // 1. Reach forward to plant at turn initiation
                // 2. Drive back behind the hip to push through the turn
                const leftReach = phasePulse(phi, 0.55, 0.52);
                const leftPush = phasePulse(phi, 1.95, 0.68);
                const rightReach = phasePulse(phi, Math.PI + 0.55, 0.52);
                const rightPush = phasePulse(phi, Math.PI + 1.95, 0.68);

                // 1. Hips (Center of Mass inclination, lateral drive, and steering)
                hipPosTarget.x = 0.16 * s;
                hipPosTarget.z = 0.03 * p;
                targets.hips.rx = 0.08 + 0.06 * p;
                targets.hips.ry = 0.26 * s;            // Steer hips/skis across fall line
                targets.hips.rz = -0.32 * s;           // Lean pelvis into the turn

                // 2. Spine (Pro-carving C-shape angulation + counter-rotation facing downhill)
                targets.spine.rx = 0.24 + 0.10 * p;    // Forward athletic tuck
                targets.spine.ry = -0.22 * s;          // Counter-rotate shoulders toward fall line
                targets.spine.rz = 0.25 * s;           // Tilt upper body outward over outside ski

                // 3. Neck & Head (Downhill gaze lock & horizon leveling)
                targets.neck.rx = -0.10 - 0.04 * p;
                targets.neck.ry = -0.05 * s;
                targets.neck.rz = 0.04 * s;

                targets.head.rx = -0.12 - 0.03 * p;
                targets.head.ry = -0.04 * s;
                targets.head.rz = 0.05 * s;

                // 4. Legs (Inside leg flexes deeper; outside leg drives pressure; both roll on edge)
                const baseThigh = -0.34 - 0.12 * p;
                const baseShin = 0.26 + 0.10 * p;

                // Left Leg (side = +1, inside during leftTurn)
                const lThigh = baseThigh - 0.22 * leftTurn + 0.06 * rightTurn;
                const lShin = baseShin + 0.12 * leftTurn - 0.04 * rightTurn;
                targets.leftHip.rx = lThigh - targets.hips.rx;
                targets.leftHip.rz = -0.14 * s;
                targets.leftKnee.rx = lShin - lThigh;
                targets.leftAnkle.rx = -lShin;
                targets.leftAnkle.rz = 0.04 * s;

                // Right Leg (side = -1, inside during rightTurn)
                const rThigh = baseThigh - 0.22 * rightTurn + 0.06 * leftTurn;
                const rShin = baseShin + 0.12 * rightTurn - 0.04 * leftTurn;
                targets.rightHip.rx = rThigh - targets.hips.rx;
                targets.rightHip.rz = -0.14 * s;
                targets.rightKnee.rx = rShin - rThigh;
                targets.rightAnkle.rx = -rShin;
                targets.rightAnkle.rz = 0.04 * s;

                // 5. Arms & Poles (Poles trail behind by default; carving-side hand reaches forward then pushes back)
                // Left Arm (+X, active during Left carve)
                targets.leftShoulder.rz = -1.16 + 0.16 * leftReach - 0.08 * leftPush - 0.06 * rightTurn;
                targets.leftShoulder.rx = -0.10 - 0.52 * leftReach + 0.56 * leftPush;
                targets.leftShoulder.ry = 0.08 - 0.14 * leftReach + 0.12 * leftPush;
                targets.leftElbow.ry = -0.78 - 0.18 * leftReach + 0.52 * leftPush;
                targets.leftElbow.rz = 0.14 + 0.05 * p;
                targets.leftWrist.rx = 1.56 - 0.52 * leftReach + 0.18 * leftPush;
                targets.leftWrist.rz = -0.45 + 0.62 * leftReach - 0.12 * leftPush;
                targets.leftWrist.ry = 0.0;

                // Right Arm (-X, active during Right carve)
                targets.rightShoulder.rz = 1.16 - 0.16 * rightReach + 0.08 * rightPush + 0.06 * leftTurn;
                targets.rightShoulder.rx = -0.10 - 0.52 * rightReach + 0.56 * rightPush;
                targets.rightShoulder.ry = -0.08 + 0.14 * rightReach - 0.12 * rightPush;
                targets.rightElbow.ry = 0.78 + 0.18 * rightReach - 0.52 * rightPush;
                targets.rightElbow.rz = -0.14 - 0.05 * p;
                targets.rightWrist.rx = 1.56 - 0.52 * rightReach + 0.18 * rightPush;
                targets.rightWrist.rz = 0.45 - 0.62 * rightReach + 0.12 * rightPush;
                targets.rightWrist.ry = 0.0;

                // Return human-readable carving phase for HUD
                if (leftReach > 0.45) return 'Carving • Left Pole Plant';
                if (leftPush > 0.45) return 'Carving • Left Pole Push';
                if (rightReach > 0.45) return 'Carving • Right Pole Plant';
                if (rightPush > 0.45) return 'Carving • Right Pole Push';
                if (s > 0.35) return 'Carving • Left Edge Apex';
                if (s < -0.35) return 'Carving • Right Edge Apex';
                return 'Carving • Edge Transition';
            }

            /**
             * ANIMATION 2: IDLE SKIING
             * Athletic ready-to-glide cruising stance with multi-frequency terrain absorption,
             * breathing, subtle lateral balance sway, and poles tucked cleanly trailing behind.
             */
            function evaluateIdleSkiing(t) {
                const bounce = Math.sin(t * 2.6);                // Micro-terrain knee absorption
                const breath = Math.sin(t * 1.45);               // Natural chest breathing
                const sway = Math.sin(t * 0.85);                 // Gentle lateral weight shift
                const scan = Math.sin(t * 0.65) + 0.35 * Math.sin(t * 1.3 + 0.5);

                // 1. Hips (Relaxed centered athletic stance)
                hipPosTarget.x = 0.025 * sway;
                hipPosTarget.z = 0.008 * bounce;
                targets.hips.rx = 0.06 + 0.015 * bounce;
                targets.hips.ry = 0.025 * sway;
                targets.hips.rz = -0.032 * sway;

                // 2. Spine (Forward cruising poise + breathing)
                targets.spine.rx = 0.17 + 0.024 * breath + 0.012 * bounce;
                targets.spine.ry = -0.02 * sway + 0.025 * Math.sin(t * 0.85 + 0.7);
                targets.spine.rz = 0.024 * sway;

                // 3. Neck & Head (Looking down the run with relaxed scanning)
                targets.neck.rx = -0.07 - 0.01 * breath;
                targets.neck.ry = 0.06 * scan;
                targets.neck.rz = 0.01 * sway;

                targets.head.rx = -0.08 - 0.01 * breath;
                targets.head.ry = 0.08 * scan;
                targets.head.rz = -0.015 * Math.sin(t * 0.65);

                // 4. Legs (Springy parallel athletic flexion)
                const lThigh = -0.28 - 0.045 * bounce - 0.02 * sway;
                const lShin = 0.24 + 0.038 * bounce + 0.015 * sway;
                targets.leftHip.rx = lThigh - targets.hips.rx;
                targets.leftHip.rz = -0.018 * sway;
                targets.leftKnee.rx = lShin - lThigh;
                targets.leftAnkle.rx = -lShin;

                const rThigh = -0.28 - 0.045 * bounce + 0.02 * sway;
                const rShin = 0.24 + 0.038 * bounce - 0.015 * sway;
                targets.rightHip.rx = rThigh - targets.hips.rx;
                targets.rightHip.rz = -0.018 * sway;
                targets.rightKnee.rx = rShin - rThigh;
                targets.rightAnkle.rx = -rShin;

                // 5. Arms & Poles (Tucked athletic glide; poles angled cleanly back behind the skier)
                targets.leftShoulder.rz = -1.22 + 0.022 * breath;
                targets.leftShoulder.rx = -0.10 - 0.020 * bounce;
                targets.leftShoulder.ry = 0.08 + 0.015 * sway;
                targets.leftElbow.ry = -0.82 - 0.025 * bounce;
                targets.leftElbow.rz = 0.15;
                targets.leftWrist.rx = 1.60 + 0.035 * breath;
                targets.leftWrist.rz = -0.45;
                targets.leftWrist.ry = 0.0;

                targets.rightShoulder.rz = 1.22 - 0.022 * breath;
                targets.rightShoulder.rx = -0.10 - 0.020 * bounce;
                targets.rightShoulder.ry = -0.08 + 0.015 * sway;
                targets.rightElbow.ry = 0.82 + 0.025 * bounce;
                targets.rightElbow.rz = -0.15;
                targets.rightWrist.rx = 1.60 + 0.035 * breath;
                targets.rightWrist.rz = 0.45;
                targets.rightWrist.ry = 0.0;

                return 'Idle Skiing • Ready Glide';
            }

            /**
             * ANIMATION 3: JUMP IN PLACE
             * Stays in place horizontally: Idle -> Crouch Windup -> Explosive Takeoff ->
             * Mid-Air Leg Spread -> Bent-Knee Landing Absorption -> Smooth Idle Recovery.
             */
            function evaluateJump(t) {
                const period = 2.6;
                const u = (t % period) / period;

                // Start from subtle idle baseline so transitions in/out feel seamless
                const idleBreath = Math.sin(t * 1.45);
                const idleBounce = Math.sin(t * 2.6);

                // Phase envelopes
                const crouch = bell(u, 0.12, 0.30, 0.40);      // Pre-jump bend
                const takeoff = bell(u, 0.32, 0.40, 0.48);     // Explosive upward pop
                const spread = bell(u, 0.41, 0.56, 0.72);      // Mid-air leg spread
                const landAbsorb = bell(u, 0.71, 0.80, 0.94);  // Bent-knee landing impact

                // Parabolic airborne lift (u in [0.38, 0.74])
                const airStart = 0.38;
                const airEnd = 0.74;
                const inAir = u > airStart && u < airEnd;
                const airT = inAir ? (u - airStart) / (airEnd - airStart) : 0;
                const parabola = inAir ? 4 * airT * (1 - airT) : 0;
                const airEase = inAir ? Math.sin(airT * Math.PI) : 0;

                // Stay strictly in place on X/Z, lift cleanly on Y
                hipPosTarget.x = 0;
                hipPosTarget.z = 0;
                airOffsetTarget = 0.82 * parabola;

                // 1. Hips (Forward pitch on crouch/land, proud upright pop at apex)
                targets.hips.rx = 0.06 + 0.10 * crouch - 0.10 * spread + 0.12 * landAbsorb;
                targets.hips.ry = 0;
                targets.hips.rz = 0;

                // 2. Spine (Loads forward on crouch & landing, opens proud in mid-air)
                targets.spine.rx = 0.17 + 0.02 * idleBreath + 0.22 * crouch - 0.14 * spread + 0.24 * landAbsorb;
                targets.spine.ry = 0;
                targets.spine.rz = 0;

                // 3. Neck & Head (Keeps eyes forward on horizon, slight upward look at takeoff)
                targets.neck.rx = -0.07 - 0.10 * crouch + 0.05 * spread - 0.10 * landAbsorb;
                targets.head.rx = -0.08 - 0.10 * crouch + 0.06 * spread - 0.11 * landAbsorb;

                // 4. Legs (Idle -> Deep Bend -> Extended Pop -> Spread Eagle -> Parallel Land -> Deep Absorb)
                const baseThigh = -0.28 - 0.025 * idleBounce;
                const baseShin = 0.24 + 0.020 * idleBounce;

                const thigh = baseThigh
                    - 0.36 * crouch
                    + 0.24 * takeoff
                    - 0.06 * spread
                    - 0.40 * landAbsorb;

                const shin = baseShin
                    + 0.32 * crouch
                    - 0.20 * takeoff
                    + 0.08 * spread
                    + 0.36 * landAbsorb;

                // Symmetric outward leg spread at mid-air apex
                const legSpreadAngle = 0.42 * spread;
                const skiTipLift = -0.18 * airEase; // Slight stylish tip lift in the air

                // Left Leg (+X)
                targets.leftHip.rx = thigh - targets.hips.rx;
                targets.leftHip.rz = legSpreadAngle;
                targets.leftHip.ry = 0.08 * spread;
                targets.leftKnee.rx = shin - thigh;
                targets.leftAnkle.rx = -shin + skiTipLift;
                targets.leftAnkle.rz = -0.14 * spread;

                // Right Leg (-X)
                targets.rightHip.rx = thigh - targets.hips.rx;
                targets.rightHip.rz = -legSpreadAngle;
                targets.rightHip.ry = -0.08 * spread;
                targets.rightKnee.rx = shin - thigh;
                targets.rightAnkle.rx = -shin + skiTipLift;
                targets.rightAnkle.rz = 0.14 * spread;

                // 5. Arms & Poles (Drop slightly on crouch, flare up/out for mid-air balance, steady on landing)
                const armLift = 0.52 * spread + 0.18 * takeoff;
                const armDrop = 0.14 * crouch + 0.16 * landAbsorb;

                // Left Arm (+X)
                targets.leftShoulder.rz = -1.22 + armLift - 0.08 * crouch + 0.18 * landAbsorb;
                targets.leftShoulder.rx = -0.10 + 0.24 * crouch - 0.22 * takeoff - 0.18 * spread - 0.20 * landAbsorb;
                targets.leftShoulder.ry = 0.08 - 0.18 * spread;
                targets.leftElbow.ry = -0.82 + 0.42 * spread - 0.12 * crouch;
                targets.leftElbow.rz = 0.15 - 0.10 * spread;
                targets.leftWrist.rx = 1.60 - 0.32 * spread + 0.15 * crouch;
                targets.leftWrist.rz = -0.45 + 0.18 * spread;

                // Right Arm (-X)
                targets.rightShoulder.rz = 1.22 - armLift + 0.08 * crouch - 0.18 * landAbsorb;
                targets.rightShoulder.rx = -0.10 + 0.24 * crouch - 0.22 * takeoff - 0.18 * spread - 0.20 * landAbsorb;
                targets.rightShoulder.ry = -0.08 + 0.18 * spread;
                targets.rightElbow.ry = 0.82 - 0.42 * spread + 0.12 * crouch;
                targets.rightElbow.rz = -0.15 + 0.10 * spread;
                targets.rightWrist.rx = 1.60 - 0.32 * spread + 0.15 * crouch;
                targets.rightWrist.rz = 0.45 - 0.18 * spread;

                if (crouch > 0.35) return 'Jump • Crouch Wind-Up';
                if (takeoff > 0.45) return 'Jump • Explosive Pop';
                if (spread > 0.35) return 'Jump • Mid-Air Spread';
                if (inAir) return 'Jump • Preparing Landing';
                if (landAbsorb > 0.30) return 'Jump • Bent-Knee Landing';
                return 'Jump • Idle Stance';
            }

            /**
             * ANIMATION 4: 360° VERTICAL SPIN (FREESTYLE STAGGERED MID-AIR TURN)
             * Natural non-rigid 360° vertical-axis spin modeled on real freestyle ski 360s:
             * Counter-Windup -> Head & Shoulder Lead -> Trailing-Leg Whip & Mid-Air Tuck ->
             * Early Landing Spot & Wide Arm Check -> Bent-Knee Stomp Absorption.
             */
            function evaluateSpin360(t) {
                const period = 2.8;
                const u = (t % period) / period;

                const airStart = 0.27;
                const airEnd = 0.76;
                const inAir = u > airStart && u < airEnd;
                const airT = inAir ? (u - airStart) / (airEnd - airStart) : 0;

                // Phase envelopes
                const windup = bell(u, 0.06, 0.20, 0.28);  // Deep crouch + upper-body coil to right
                const snapLead = bell(u, 0.21, 0.30, 0.44);  // Head & shoulders whip left AHEAD of hips
                const midTuck = bell(u, 0.34, 0.52, 0.68);  // Stylish asymmetric mid-air tuck
                const spotCheck = bell(u, 0.60, 0.72, 0.80);  // Head spots landing; arms flare to brake spin
                const stompLand = bell(u, 0.74, 0.82, 0.95);  // Bent-knee stomp absorption

                // Parabolic airborne lift (stays cleanly upright on vertical Y-axis)
                const parabola = inAir ? 4 * airT * (1 - airT) : 0;
                airOffsetTarget = 0.92 * parabola;

                // Staggered vertical 360° spin curve:
                // Hips lag slightly behind shoulder launch, accelerate through mid-air tuck, ease into landing
                let spinAngle = 0;
                if (inAir) {
                    const staggeredEase = smoothstep(0, 1, airT) * 0.42 + airT * 0.58;
                    spinAngle = Math.PI * 2 * staggeredEase; // Full 360° left spin around vertical +Y axis
                } else if (u >= airEnd) {
                    spinAngle = Math.PI * 2; // Equivalent to 0 via shortest-angle wrapping
                }

                hipPosTarget.x = 0;
                hipPosTarget.z = 0;

                // 1. Hips (Anticipation counter-twist -> staggered 360° vertical Y spin -> stomp)
                targets.hips.ry = -0.10 * windup + spinAngle + 0.06 * stompLand;
                targets.hips.rx = 0.06 + 0.10 * windup - 0.08 * midTuck + 0.12 * stompLand;
                targets.hips.rz = 0.08 * windup - 0.12 * snapLead - 0.08 * midTuck + 0.06 * spotCheck;

                // 2. Spine (STAGGERED: Coils right, whips left ahead of hips, counter-checks on landing)
                targets.spine.ry = -0.58 * windup + 0.62 * snapLead + 0.16 * midTuck - 0.34 * spotCheck - 0.10 * stompLand;
                targets.spine.rx = 0.17 + 0.24 * windup - 0.08 * snapLead + 0.16 * midTuck - 0.06 * spotCheck + 0.26 * stompLand;
                targets.spine.rz = 0.14 * windup - 0.14 * snapLead - 0.08 * midTuck + 0.10 * spotCheck;

                // 3. Neck & Head (Leads the launch aggressively, then snaps ahead to spot the snow)
                targets.neck.ry = -0.18 * windup + 0.28 * snapLead + 0.24 * spotCheck - 0.06 * stompLand;
                targets.neck.rx = -0.07 - 0.08 * windup + 0.05 * midTuck - 0.12 * spotCheck - 0.08 * stompLand;
                targets.neck.rz = 0.05 * windup - 0.08 * snapLead + 0.06 * spotCheck;

                targets.head.ry = -0.22 * windup + 0.36 * snapLead + 0.32 * spotCheck - 0.08 * stompLand;
                targets.head.rx = -0.08 - 0.08 * windup + 0.04 * midTuck - 0.14 * spotCheck - 0.10 * stompLand;
                targets.head.rz = 0.06 * windup - 0.10 * snapLead + 0.08 * spotCheck;

                // 4. Legs (Deep pre-load -> brief trailing whip -> asymmetric freestyle tuck -> parallel stomp)
                const baseThigh = -0.28;
                const baseShin = 0.24;

                // Left Leg (+X, slightly higher tucked knee for natural freestyle silhouette)
                const lThigh = baseThigh - 0.36 * windup + 0.22 * snapLead - 0.56 * midTuck + 0.12 * spotCheck - 0.42 * stompLand;
                const lShin = baseShin + 0.32 * windup - 0.18 * snapLead + 0.52 * midTuck - 0.10 * spotCheck + 0.38 * stompLand;
                targets.leftHip.rx = lThigh - targets.hips.rx;
                targets.leftHip.ry = -0.18 * snapLead + 0.10 * midTuck; // Trails behind shoulders at takeoff
                targets.leftHip.rz = 0.06 * midTuck;
                targets.leftKnee.rx = lShin - lThigh;
                targets.leftAnkle.rx = -lShin - 0.16 * midTuck;

                // Right Leg (-X, slightly lower tuck for organic asymmetry)
                const rThigh = baseThigh - 0.36 * windup + 0.24 * snapLead - 0.42 * midTuck + 0.10 * spotCheck - 0.40 * stompLand;
                const rShin = baseShin + 0.32 * windup - 0.20 * snapLead + 0.40 * midTuck - 0.08 * spotCheck + 0.36 * stompLand;
                targets.rightHip.rx = rThigh - targets.hips.rx;
                targets.rightHip.ry = -0.18 * snapLead + 0.10 * midTuck;
                targets.rightHip.rz = -0.08 * midTuck;
                targets.rightKnee.rx = rShin - rThigh;
                targets.rightAnkle.rx = -rShin - 0.14 * midTuck;

                // 5. Arms & Poles (Coil right -> throw left -> tuck tight to spin -> flare wide to check)
                // Left Arm (+X, lead arm opens into the spin, tucks in, then flares to brake)
                targets.leftShoulder.rz = -1.22 - 0.10 * windup + 0.55 * snapLead + 0.12 * midTuck + 0.85 * spotCheck + 0.18 * stompLand;
                targets.leftShoulder.rx = -0.10 + 0.32 * windup - 0.42 * snapLead - 0.24 * midTuck - 0.12 * spotCheck - 0.18 * stompLand;
                targets.leftShoulder.ry = 0.08 + 0.38 * windup - 0.45 * snapLead + 0.22 * midTuck - 0.32 * spotCheck;
                targets.leftElbow.ry = -0.82 - 0.15 * windup + 0.28 * snapLead - 0.42 * midTuck + 0.52 * spotCheck;
                targets.leftElbow.rz = 0.15 + 0.12 * midTuck - 0.14 * spotCheck;
                targets.leftWrist.rx = 1.60 + 0.15 * windup - 0.35 * midTuck - 0.28 * spotCheck;
                targets.leftWrist.rz = -0.45 + 0.18 * midTuck + 0.22 * spotCheck;

                // Right Arm (-X, drives across chest for rotational torque, then flares wide to stop spin)
                targets.rightShoulder.rz = 1.22 + 0.16 * windup - 0.38 * snapLead - 0.10 * midTuck - 0.85 * spotCheck - 0.18 * stompLand;
                targets.rightShoulder.rx = -0.10 + 0.36 * windup - 0.58 * snapLead - 0.28 * midTuck - 0.12 * spotCheck - 0.18 * stompLand;
                targets.rightShoulder.ry = -0.08 + 0.42 * windup - 0.52 * snapLead - 0.26 * midTuck + 0.32 * spotCheck;
                targets.rightElbow.ry = 0.82 + 0.18 * windup + 0.36 * snapLead + 0.46 * midTuck - 0.52 * spotCheck;
                targets.rightElbow.rz = -0.15 - 0.12 * midTuck + 0.14 * spotCheck;
                targets.rightWrist.rx = 1.60 + 0.15 * windup - 0.35 * midTuck - 0.28 * spotCheck;
                targets.rightWrist.rz = 0.45 - 0.18 * midTuck - 0.22 * spotCheck;

                if (windup > 0.35) return '360° Spin • Counter-Windup';
                if (snapLead > 0.42) return '360° Spin • Shoulder Lead';
                if (midTuck > 0.38) return '360° Spin • Mid-Air Tuck';
                if (spotCheck > 0.32) return '360° Spin • Spotting & Check';
                if (stompLand > 0.30) return '360° Spin • Stomp Landing';
                return '360° Spin • Ready Glide';
            }

            // Temporary vectors for analytical foot/ski grounding
            const tmpWorld = new THREE.Vector3();
            const invRootMatrix = new THREE.Matrix4();

            function groundCharacter() {
                root.updateMatrixWorld(true);
                invRootMatrix.copy(root.matrixWorld).invert();

                let minY = Infinity;
                for (let i = 0; i < footContacts.length; i++) {
                    footContacts[i].getWorldPosition(tmpWorld);
                    tmpWorld.applyMatrix4(invRootMatrix);
                    if (tmpWorld.y < minY) minY = tmpWorld.y;
                }

                if (Number.isFinite(minY)) {
                    joints.hips.position.y -= minY;
                }
            }

            function update(dt) {
                const clampedDt = Math.min(dt, 0.05);
                if (isPlaying && mode !== 'tpose') {
                    animTime += clampedDt * speed;
                }

                clearTargets();
                let phaseText = 'T-Pose • Neutral Rig';

                if (mode === 'carving') {
                    phaseText = evaluateCarving(animTime);
                } else if (mode === 'idle') {
                    phaseText = evaluateIdleSkiing(animTime);
                } else if (mode === 'jump') {
                    phaseText = evaluateJump(animTime);
                } else if (mode === 'spin360') {
                    phaseText = evaluateSpin360(animTime);
                }

                // Smooth frame-rate independent exponential blending (faster response for aerial snaps)
                const lambda = (mode === 'spin360' || mode === 'jump') ? 13.5 : 8.5;
                const blend = 1 - Math.exp(-lambda * clampedDt);

                jointNames.forEach((name) => {
                    const j = joints[name];
                    const tgt = targets[name];
                    j.rotation.x += (tgt.rx - j.rotation.x) * blend;
                    if (name === 'hips') {
                        // Shortest-angle deltas guarantee seamless 360° wrapping on Y and Z
                        j.rotation.y += shortestAngleDelta(tgt.ry, j.rotation.y) * blend;
                        j.rotation.z += shortestAngleDelta(tgt.rz, j.rotation.z) * blend;
                    } else {
                        j.rotation.y += (tgt.ry - j.rotation.y) * blend;
                        j.rotation.z += (tgt.rz - j.rotation.z) * blend;
                    }
                });

                joints.hips.position.x += (hipPosTarget.x - joints.hips.position.x) * blend;
                joints.hips.position.z += (hipPosTarget.z - joints.hips.position.z) * blend;

                airOffsetCurrent += (airOffsetTarget - airOffsetCurrent) * blend;
                freeAirBlendCurrent += (freeAirBlendTarget - freeAirBlendCurrent) * blend;
                freeAirHipYCurrent += (freeAirHipYTarget - freeAirHipYCurrent) * blend;

                // Grounding + Airborne Parabolic Trajectory
                if (freeAirBlendCurrent < 0.005) {
                    // Grounded or upright jump: keep lowest ski edge at y = 0 + upright airOffset
                    groundCharacter();
                    joints.hips.position.y += airOffsetCurrent;
                } else {
                    // Inverted trick: smoothly blend between grounded hip height and parabolic COM arc
                    groundCharacter();
                    const groundedY = joints.hips.position.y + airOffsetCurrent;
                    joints.hips.position.y = groundedY * (1 - freeAirBlendCurrent) + freeAirHipYCurrent * freeAirBlendCurrent;
                }

                return phaseText;
            }

            return {
                update,
                setMode(newMode) {
                    mode = newMode;
                    if (newMode === 'jump' || newMode === 'spin360') {
                        animTime = 0; // Start aerial animations cleanly from Idle -> Windup
                    }
                },
                getMode() {
                    return mode;
                },
                setPlaying(val) {
                    isPlaying = val;
                },
                isPlaying() {
                    return isPlaying;
                },
                setSpeed(val) {
                    speed = val;
                }
            };
        }

        /**
         * ============================================================================
         * RIG VISUALIZER OVERLAY
         * ============================================================================
         */
        function createRigVisualizer(joints) {
            const group = new THREE.Group();
            group.visible = false;

            const bonePairs = [
                ['hips', 'spine'],
                ['spine', 'neck'],
                ['neck', 'head'],
                ['spine', 'leftShoulder'],
                ['leftShoulder', 'leftElbow'],
                ['leftElbow', 'leftWrist'],
                ['spine', 'rightShoulder'],
                ['rightShoulder', 'rightElbow'],
                ['rightElbow', 'rightWrist'],
                ['hips', 'leftHip'],
                ['leftHip', 'leftKnee'],
                ['leftKnee', 'leftAnkle'],
                ['hips', 'rightHip'],
                ['rightHip', 'rightKnee'],
                ['rightKnee', 'rightAnkle']
            ];

            const jointMarkers = new Map();
            const markerGeo = new THREE.SphereGeometry(0.022, 10, 10);
            const markerMat = new THREE.MeshBasicMaterial({
                color: 0x0ea5e9,
                depthTest: false,
                transparent: true,
                opacity: 0.95
            });

            Object.entries(joints).forEach(([key, joint]) => {
                if (key.endsWith('Pole')) return;
                const marker = new THREE.Mesh(markerGeo, markerMat);
                marker.renderOrder = 999;
                group.add(marker);
                jointMarkers.set(key, { joint, marker });
            });

            const linePositions = new Float32Array(bonePairs.length * 2 * 3);
            const lineGeo = new THREE.BufferGeometry();
            lineGeo.setAttribute('position', new THREE.BufferAttribute(linePositions, 3));
            const lineMat = new THREE.LineBasicMaterial({
                color: 0x0284c7,
                depthTest: false,
                transparent: true,
                opacity: 0.85
            });
            const lines = new THREE.LineSegments(lineGeo, lineMat);
            lines.renderOrder = 998;
            group.add(lines);

            const tmpA = new THREE.Vector3();
            const tmpB = new THREE.Vector3();

            function update() {
                if (!group.visible) return;
                jointMarkers.forEach(({ joint, marker }) => {
                    joint.getWorldPosition(tmpA);
                    marker.position.copy(tmpA);
                });

                const posAttr = lineGeo.attributes.position;
                bonePairs.forEach(([fromKey, toKey], idx) => {
                    joints[fromKey].getWorldPosition(tmpA);
                    joints[toKey].getWorldPosition(tmpB);
                    posAttr.setXYZ(idx * 2, tmpA.x, tmpA.y, tmpA.z);
                    posAttr.setXYZ(idx * 2 + 1, tmpB.x, tmpB.y, tmpB.z);
                });
                posAttr.needsUpdate = true;
            }

            return { group, update };
        }

        /**
         * ============================================================================
         * MAIN APPLICATION (Three.js Studio Scene + Rapier3D Physics + Animator)
         * ============================================================================
         */
        async function initApp() {
            const container = document.getElementById('canvas-container');
            const statusText = document.getElementById('status-text');
            const phaseReadout = document.getElementById('phase-readout');
            const physicsDot = document.getElementById('physics-dot');
            const toast = document.getElementById('toast');

            // 1. Scene & Renderer
            const scene = new THREE.Scene();

            const renderer = new THREE.WebGLRenderer({
                antialias: true,
                alpha: true,
                powerPreference: 'high-performance'
            });
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.06;
            container.appendChild(renderer.domElement);

            // 2. Camera & OrbitControls (Three-quarter front view framed for both carving & high-air tricks)
            const defaultCamPos = new THREE.Vector3(1.25, 1.38, 3.85);
            const defaultTarget = new THREE.Vector3(0, 1.05, 0);

            const camera = new THREE.PerspectiveCamera(
                34,
                container.clientWidth / container.clientHeight,
                0.1,
                50
            );
            camera.position.copy(defaultCamPos);

            const controls = new OrbitControls(camera, renderer.domElement);
            controls.target.copy(defaultTarget);
            controls.enableDamping = true;
            controls.dampingFactor = 0.06;
            controls.minDistance = 1.5;
            controls.maxDistance = 7.5;
            controls.maxPolarAngle = Math.PI * 0.52;
            controls.update();

            // 3. Soft Diffused Studio Lighting
            const hemiLight = new THREE.HemisphereLight(0xffffff, 0xd4dae3, 1.55);
            hemiLight.position.set(0, 10, 0);
            scene.add(hemiLight);

            const keyLight = new THREE.DirectionalLight(0xfffcf7, 1.15);
            keyLight.position.set(-2.2, 6.5, 4.8);
            keyLight.castShadow = true;
            keyLight.shadow.mapSize.width = 2048;
            keyLight.shadow.mapSize.height = 2048;
            keyLight.shadow.camera.near = 1;
            keyLight.shadow.camera.far = 15;
            keyLight.shadow.camera.left = -2.4;
            keyLight.shadow.camera.right = 2.4;
            keyLight.shadow.camera.top = 2.6;
            keyLight.shadow.camera.bottom = -1.6;
            keyLight.shadow.bias = -0.0005;
            keyLight.shadow.radius = 4;
            scene.add(keyLight);

            const fillLight = new THREE.DirectionalLight(0xeef4fc, 0.55);
            fillLight.position.set(3.2, 1.8, 3.0);
            scene.add(fillLight);

            const rimLight = new THREE.DirectionalLight(0xdbe7f7, 0.45);
            rimLight.position.set(2.5, 3.2, -3.5);
            scene.add(rimLight);

            // 4. Minimal Shadow-Only Floor + Subtle Carving Reference Grid Ring
            const shadowFloorGeo = new THREE.PlaneGeometry(12, 12);
            shadowFloorGeo.rotateX(-Math.PI / 2);
            const shadowFloorMat = new THREE.ShadowMaterial({
                color: 0x3b4252,
                opacity: 0.10
            });
            const shadowFloor = new THREE.Mesh(shadowFloorGeo, shadowFloorMat);
            shadowFloor.receiveShadow = true;
            scene.add(shadowFloor);

            // 5. Build Skier Character, Animator & Rig Overlay
            const skier = buildSkierCharacter(PALETTES.coral);
            skier.setSkisVisible(true);
            scene.add(skier.root);

            const animator = createSkierAnimator(skier);

            const rigVisualizer = createRigVisualizer(skier.joints);
            scene.add(rigVisualizer.group);

            // Expose rig & animation API globally
            window.skierRig = {
                root: skier.root,
                joints: skier.joints,
                setPalette: skier.setPalette,
                setSkisVisible: skier.setSkisVisible,
                resetPose: skier.resetPose,
                setAnimation: (mode) => {
                    animator.setMode(mode);
                    updateAnimButtons(mode);
                }
            };

            // 6. Initialize Rapier3D Physics World
            let rapierWorld = null;
            let skierBody = null;
            const capsuleRadius = 0.24;
            const capsuleHalfHeight = 0.62;
            const capsuleCenterOffset = capsuleRadius + capsuleHalfHeight;

            try {
                const RAPIER = await import('https://esm.sh/@dimforge/rapier3d-compat@0.12.0');
                await RAPIER.init();

                rapierWorld = new RAPIER.World({ x: 0.0, y: -9.81, z: 0.0 });

                const groundDesc = RAPIER.ColliderDesc.cuboid(10.0, 0.1, 10.0).setTranslation(0.0, -0.1, 0.0);
                rapierWorld.createCollider(groundDesc);

                const bodyDesc = RAPIER.RigidBodyDesc.dynamic()
                    .setTranslation(0.0, capsuleCenterOffset, 0.0)
                    .lockRotations();
                skierBody = rapierWorld.createRigidBody(bodyDesc);

                const colliderDesc = RAPIER.ColliderDesc.capsule(capsuleHalfHeight, capsuleRadius)
                    .setRestitution(0.08)
                    .setFriction(0.6);
                rapierWorld.createCollider(colliderDesc, skierBody);

                statusText.textContent = 'Rapier3D Active • Procedural Animator';
                physicsDot.classList.remove('bg-amber-400', 'animate-pulse');
                physicsDot.classList.add('bg-emerald-500');
            } catch (err) {
                console.warn('Rapier3D failed to load, running in visual-only mode:', err);
                statusText.textContent = 'Visual Rig Mode • Procedural Animator';
                physicsDot.classList.remove('bg-amber-400', 'animate-pulse');
                physicsDot.classList.add('bg-sky-500');
            }

            // 7. UI Interactions
            const animBtns = document.querySelectorAll('.anim-btn');
            let skisEnabled = true;

            function updateAnimButtons(activeMode) {
                animBtns.forEach((b) => {
                    b.classList.toggle('active', b.dataset.anim === activeMode);
                });
            }

            animBtns.forEach((btn) => {
                btn.addEventListener('click', () => {
                    const selected = btn.dataset.anim;
                    animator.setMode(selected);
                    updateAnimButtons(selected);
                    // Hide skis automatically in T-Pose if desired, restore in ski modes
                    skier.setSkisVisible(selected === 'tpose' ? false : skisEnabled);
                });
            });

            const btnSkis = document.getElementById('btn-skis');
            btnSkis.addEventListener('click', () => {
                skisEnabled = !skisEnabled;
                skier.setSkisVisible(skisEnabled);
                btnSkis.classList.toggle('bg-slate-800', skisEnabled);
                btnSkis.classList.toggle('text-white', skisEnabled);
                btnSkis.classList.toggle('text-slate-700', !skisEnabled);
                btnSkis.classList.toggle('hover:bg-white/80', !skisEnabled);
            });

            const btnPlayPause = document.getElementById('btn-play-pause');
            const iconPause = document.getElementById('icon-pause');
            const iconPlay = document.getElementById('icon-play');
            btnPlayPause.addEventListener('click', () => {
                const next = !animator.isPlaying();
                animator.setPlaying(next);
                iconPause.classList.toggle('hidden', !next);
                iconPlay.classList.toggle('hidden', next);
            });

            const speedSlider = document.getElementById('speed-slider');
            const speedLabel = document.getElementById('speed-label');
            speedSlider.addEventListener('input', (e) => {
                const val = parseFloat(e.target.value);
                animator.setSpeed(val);
                speedLabel.textContent = `${val.toFixed(1)}x`;
            });

            const btnRig = document.getElementById('btn-rig');
            btnRig.addEventListener('click', () => {
                rigVisualizer.group.visible = !rigVisualizer.group.visible;
                btnRig.classList.toggle('bg-slate-800', rigVisualizer.group.visible);
                btnRig.classList.toggle('text-white', rigVisualizer.group.visible);
                btnRig.classList.toggle('hover:bg-white/80', !rigVisualizer.group.visible);
            });

            const btnDrop = document.getElementById('btn-drop');
            btnDrop.addEventListener('click', () => {
                if (skierBody) {
                    skierBody.setTranslation({ x: 0, y: capsuleCenterOffset + 1.35, z: 0 }, true);
                    skierBody.setLinvel({ x: 0, y: 0, z: 0 }, true);
                } else {
                    skier.root.position.y = 0.6;
                }
            });

            const btnResetCam = document.getElementById('btn-reset-cam');
            btnResetCam.addEventListener('click', () => {
                camera.position.copy(defaultCamPos);
                controls.target.copy(defaultTarget);
                controls.update();
            });

            const swatches = document.querySelectorAll('.swatch-btn');
            swatches.forEach((btn) => {
                btn.addEventListener('click', () => {
                    swatches.forEach((b) => b.classList.remove('active'));
                    btn.classList.add('active');
                    skier.setPalette(btn.dataset.palette);
                });
            });

            // Brief onboarding hint toast
            setTimeout(() => {
                toast.classList.remove('opacity-0');
                setTimeout(() => toast.classList.add('opacity-0'), 4200);
            }, 600);

            // 8. Responsive Resize Handling
            window.addEventListener('resize', () => {
                const w = container.clientWidth;
                const h = container.clientHeight;
                camera.aspect = w / h;
                camera.updateProjectionMatrix();
                renderer.setSize(w, h);
            });

            // 9. Main Render, Animation & Physics Loop
            const clock = new THREE.Clock();
            let lastPhase = '';

            function animate() {
                requestAnimationFrame(animate);
                const dt = clock.getDelta();

                if (rapierWorld && skierBody) {
                    rapierWorld.step();
                    const t = skierBody.translation();
                    skier.root.position.set(t.x, t.y - capsuleCenterOffset, t.z);
                } else if (skier.root.position.y > 0) {
                    skier.root.position.y = Math.max(0, skier.root.position.y - 0.03);
                }

                const currentPhase = animator.update(dt);
                if (currentPhase !== lastPhase) {
                    phaseReadout.textContent = currentPhase;
                    lastPhase = currentPhase;
                }

                rigVisualizer.update();
                controls.update();
                renderer.render(scene, camera);
            }

            animate();
        }

        window.addEventListener('load', initApp);
    </script>
</body>

</html>
